# Restore product/banner/shop images only (no API binary deploy).
# Additive FTP — never deletes remote uploads.

name: Restore uploads → MonsterASP

on:
  workflow_dispatch:

concurrency:
  group: restore-uploads-monsterasp
  cancel-in-progress: false

jobs:
  restore:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER)) { $missing += 'FTP_SERVER' }
          if ([string]::IsNullOrWhiteSpace($env:FTP_USERNAME)) { $missing += 'FTP_USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) { $missing += 'FTP_PASSWORD' }
          if ($missing.Count -gt 0) { throw "Missing GitHub Secrets: $($missing -join ', ')" }

      - name: Upload images (additive, create dirs)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          LOCAL_UPLOADS: Eseller.API/wwwroot/uploads
        run: |
          ./deploy/monsterasp/upload-uploads-additive.ps1
