# Push → build Eseller.API → FTP deploy to MonsterASP wwwroot
# Secrets (repo Settings → Secrets → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional: FTP_SERVER_DIR=/wwwroot/  FTP_PROTOCOL=ftps|ftp
#
# CRITICAL: Never use FTP-Deploy-Action with a tiny local folder (e.g. only app_offline.htm).
# That action MIRRORS and deletes everything else on the server (DLLs + uploads).

name: Deploy API → MonsterASP

on:
  push:
    branches: [master, main, "minor-fixes**"]
    paths:
      - "Eseller.API/**"
      - "Eseller.Application/**"
      - "Eseller.Domain/**"
      - "Eseller.Infrastructure/**"
      - "deploy/monsterasp/**"
      - ".github/workflows/deploy-monsterasp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-monsterasp
  # Never cancel mid-deploy: cancelling after app_offline.htm upload leaves the API
  # stuck on "Updating Eseller API…" (IIS 503 → browsers report false CORS errors).
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER)) { $missing += 'FTP_SERVER' }
          if ([string]::IsNullOrWhiteSpace($env:FTP_USERNAME)) { $missing += 'FTP_USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) { $missing += 'FTP_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Secrets: $($missing -join ', ')"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish API
        shell: pwsh
        run: |
          $out = "publish"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish "Eseller.API/Eseller.API.csproj" -c Release -o $out --self-contained false `
            /p:DebugType=None /p:DebugSymbols=false `
            /p:SatelliteResourceLanguages=en `
            /p:CopyOutputSymbolsToPublishDirectory=false
          Copy-Item "deploy/monsterasp/web.config" "$out/web.config" -Force
          New-Item -ItemType Directory -Path "$out/logs" -Force | Out-Null
          Set-Content "$out/logs/.keep" -Value "keep"
          # Keep uploads in publish for the additive curl step only — excluded from mirror deploy.
          $srcUploads = "Eseller.API/wwwroot/uploads"
          $dstUploads = "$out/wwwroot/uploads"
          New-Item -ItemType Directory -Path $dstUploads -Force | Out-Null
          if (Test-Path $srcUploads) {
            Copy-Item -Path "$srcUploads\*" -Destination $dstUploads -Recurse -Force
            Write-Host "Copied uploads files: $((Get-ChildItem $dstUploads -Recurse -File).Count)"
          } else {
            Set-Content "$dstUploads/.keep" -Value "keep"
          }
          # Keep server Production secrets (password/JWT) intact
          Remove-Item "$out/appsettings.Production.json" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out -Recurse -Directory |
            Where-Object { @('cs','de','es','fr','it','ja','ko','pl','pt-BR','ru','tr','zh-Hans','zh-Hant') -contains $_.Name } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Published files: $((Get-ChildItem $out -Recurse -File).Count)"

      - name: Stop site (single-file app_offline — no mirror delete)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
        run: |
          $html = "<html><body><h1>Updating Eseller API…</h1></body></html>"
          $tmp = Join-Path $env:RUNNER_TEMP "app_offline.htm"
          Set-Content -Path $tmp -Value $html -Encoding ascii
          $dir = $env:FTP_SERVER_DIR.TrimEnd('/')
          $url = "ftp://$($env:FTP_SERVER)$dir/app_offline.htm"
          $ssl = @()
          if ($env:FTP_PROTOCOL -ne 'ftp') { $ssl = @('--ssl-reqd','--ftp-ssl') }
          & curl.exe -sS --fail @ssl -u "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)" -T $tmp $url
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FTPS put failed; retry plain FTP"
            & curl.exe -sS --fail -u "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)" -T $tmp $url
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload app_offline.htm" }
          }
          Write-Host "Uploaded app_offline.htm only (no directory sync)."

      - name: Wait for IIS unlock
        shell: pwsh
        run: Start-Sleep -Seconds 8

      - name: Invalidate FTP sync state (force full binary re-upload)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
        run: |
          # After a bad mirror wipe, sync-state still thinks DLLs exist → skips restore.
          $dir = $env:FTP_SERVER_DIR.TrimEnd('/')
          $url = "ftp://$($env:FTP_SERVER)$dir/.ftp-deploy-sync-state.json"
          foreach ($enableSsl in @($true, $false)) {
            try {
              $req = [System.Net.FtpWebRequest]::Create($url)
              $req.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
              $req.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USERNAME, $env:FTP_PASSWORD)
              $req.UsePassive = $true
              $req.EnableSsl = $enableSsl
              $resp = $req.GetResponse(); $resp.Close()
              Write-Host "Deleted .ftp-deploy-sync-state.json (ssl=$enableSsl)"
              exit 0
            } catch {
              Write-Host "sync-state delete ssl=$enableSsl : $($_.Exception.Message)"
            }
          }
          Write-Host "No sync-state file (ok)."
          exit 0

      - name: Deploy publish folder (exclude uploads — never mirror-delete images)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Production.json
            **/logs/**
            **/wwwroot/uploads/**
            **/wwwroot/uploads/**
            wwwroot/uploads/**
            **/*.pdb

      # Additive only — curl --ftp-create-dirs; never deletes remote files.
      - name: Upload product/banner images (additive, no delete)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          LOCAL_UPLOADS: publish/wwwroot/uploads
        run: |
          ./deploy/monsterasp/upload-uploads-additive.ps1

      - name: Remove app_offline.htm
        if: always()
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
        run: |
          $dir = $env:FTP_SERVER_DIR.TrimEnd('/')
          $url = "ftp://$($env:FTP_SERVER)$dir/app_offline.htm"
          $removed = $false
          foreach ($enableSsl in @($true, $false)) {
            try {
              $req = [System.Net.FtpWebRequest]::Create($url)
              $req.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
              $req.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USERNAME, $env:FTP_PASSWORD)
              $req.UsePassive = $true
              $req.EnableSsl = $enableSsl
              $resp = $req.GetResponse(); $resp.Close()
              Write-Host "Removed app_offline.htm (ssl=$enableSsl)"
              $removed = $true
              break
            } catch {
              Write-Host "delete attempt ssl=$enableSsl : $($_.Exception.Message)"
            }
          }
          if (-not $removed) {
            Write-Host "app_offline.htm already absent or could not delete (non-fatal)."
          }
          exit 0
